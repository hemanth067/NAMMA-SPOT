name: Build NammaSpot APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: build
        with:
          command: buildozer android debug
          workdir: .
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NammaSpot-APK
          path: bin/*.apk
